<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Academia - Cadastro</title>
  <link rel="stylesheet" href="style.css">
  <!-- Puxando o JavaScript externo -->
  <script src="cadastro.js" defer></script>
</head>
<body>

  <div class="container">
    <h2>Criar Conta</h2>
    
    <form id="formCadastro">
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="nome" required>
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="senha" required>
      </div>

      <div class="form-group">
        <label>Você é:</label>
        <select id="tipoConta" required>
          <option value="CLIENTE">Cliente</option>
          <option value="DONO">Dono da Academia</option>
          <option value="SUPER">Super Usuário</option>
        </select>
      </div>

      <button type="submit">Cadastrar</button>
    </form>

    <div id="mensagem" class="mensagem"></div>

    <p>Já tem uma conta? <a href="index.html">Faça Login</a></p>
  </div>

</body>
</html>
