<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Fit - Super Administrador</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="super.js" defer></script>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="painel-super.html">
      <span class="brand-mark"><i class="fa-solid fa-shield-halved"></i></span>
      <span>Sistema Fit<small>Master Control</small></span>
    </a>

    <div class="topbar-user">
      <div class="user-chip">
        <div class="avatar avatar-sm" data-usuario-iniciais></div>
        <span data-usuario-nome></span>
      </div>
      <button class="btn btn-ghost btn-sm" data-sair><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 id="saudacao">Controle central</h1>
        <p>Gerenciamento de contas de donos de academia.</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-icon"><i class="fa-solid fa-building"></i></div>
        <div><span>Academias</span><strong id="stat-donos">—</strong></div>
      </div>
      <div class="stat">
        <div class="stat-icon info"><i class="fa-solid fa-tags"></i></div>
        <div><span>Planos cadastrados</span><strong id="stat-planos">—</strong></div>
      </div>
      <div class="stat">
        <div class="stat-icon warn"><i class="fa-solid fa-id-card"></i></div>
        <div><span>Matrículas</span><strong id="stat-matriculas">—</strong></div>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-head">
        <h2><i class="fa-solid fa-users"></i> Contas cadastradas</h2>
        <div class="input-icon">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" class="input" id="filtro-usuarios" placeholder="Filtrar por nome ou e-mail" aria-label="Filtrar contas">
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Cargo</th>
            <th>Planos</th>
            <th>Matrículas</th>
            <th>Cadastro</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-usuarios"></tbody>
      </table>
    </div>
  </main>

</body>
</html>
